<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Center Node Gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- LinkedIn Blue -->
    <linearGradient id="liGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- YouTube / Red -->
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Instagram Gradient -->
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Facebook Blue -->
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Line Pulse Glow -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Network Connectors -->
  <!-- Center to Top Right (LinkedIn) -->
  <line x1="206" y1="256" x2="356" y2="160" stroke="url(#lineGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Center to Bottom Right (Instagram/Facebook) -->
  <line x1="206" y1="256" x2="356" y2="352" stroke="url(#lineGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Center to Top (YouTube) -->
  <line x1="206" y1="256" x2="150" y2="150" stroke="url(#lineGrad)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Orbital Ring / Sync Pulse Arc -->
  <path d="M 206 136 A 120 120 0 0 1 326 256" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>
  <path d="M 86 256 A 120 120 0 0 1 206 376" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>

  <!-- Peripheral Satellite Nodes -->
  <!-- Top Satellite (YouTube Red) -->
  <circle cx="150" cy="150" r="32" fill="url(#ytGrad)" filter="url(#glow)"/>
  <!-- Play triangle inside Top Node -->
  <polygon points="144,138 162,150 144,162" fill="#ffffff"/>

  <!-- Top Right Satellite (LinkedIn Cyan/Blue) -->
  <circle cx="356" cy="160" r="48" fill="url(#liGrad)" filter="url(#glow)"/>
  <circle cx="356" cy="160" r="40" fill="url(#liGrad)"/>
  <circle cx="356" cy="160" r="20" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="356" cy="160" r="10" fill="#ffffff"/>

  <!-- Bottom Right Satellite (Instagram Vibrant Pink/Violet) -->
  <circle cx="356" cy="352" r="54" fill="url(#igGrad)" filter="url(#glow)"/>
  <circle cx="356" cy="352" r="46" fill="url(#igGrad)"/>
  <!-- Camera lens aesthetic inside IG node -->
  <rect x="336" y="332" width="40" height="40" rx="10" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="356" cy="352" r="10" fill="none" stroke="#ffffff" stroke-width="5"/>
  <circle cx="367" cy="341" r="2.5" fill="#ffffff"/>

  <!-- Central Hub Node (Publisher Core) -->
  <circle cx="206" cy="256" r="76" fill="url(#centerGrad)" filter="url(#glow)"/>
  <circle cx="206" cy="256" r="66" fill="url(#centerGrad)"/>
  
  <!-- Modern Paper Airplane / Broadcast Icon in Center -->
  <g transform="translate(166, 216)">
    <path d="M 12 40 L 68 12 L 40 68 L 34 46 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 34 46 L 68 12 L 34 38 Z" fill="#e0e7ff"/>
  </g>
</svg>
